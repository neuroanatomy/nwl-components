on:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version-file: .nvmrc
        - run: npm ci
        # ESLint, then no hex colour outside src/styles/tokens.css
        - run: npm run lint
        - run: npx playwright install --with-deps chromium
          timeout-minutes: 10
        - run: |
            npm run storybook &
            sleep 5
            npm run test-storybook

  # Canary: the same tests on the next Node major, so breakage shows up early.
  # Non-blocking (see NODE-POLICY.md in the coordination folder).
  test-node-current:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version: current
        - run: npm ci
        - run: npx playwright install --with-deps chromium
          timeout-minutes: 10
        - run: |
            npm run storybook &
            sleep 5
            npm run test-storybook

  # The Storybook (components, widgets, Icons/Finder) as a static site on GitHub Pages:
  # https://neuroanatomy.github.io/nwl-components/
  # Needs Settings → Pages → Source: "GitHub Actions" once.
  storybook-pages:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # one deployment at a time; a newer push replaces a queued one
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      # Publish only when package.json's version is not on npm yet, so that pushes
      # without a version bump don't fail the job.
      - name: Publish if the version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "nwl-components@$VERSION" version > /dev/null 2>&1; then
            echo "nwl-components@$VERSION is already on npm, nothing to publish"
          else
            npm publish
          fi
