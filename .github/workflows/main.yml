on:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version: 16
        - run: npm ci
        - run: npx playwright install --with-deps
        - run: |
            npm run storybook &
            sleep 5
            npm run test-storybook

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 16

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm publish
